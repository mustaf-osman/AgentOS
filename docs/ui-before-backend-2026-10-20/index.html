<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifoundry · 科研工作台</title><link rel="stylesheet" href="styles.css"></head>
<body>
<svg class="svg-library" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M4 11h16M11 11v9"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5C8 2 3 4 3 4v15s5-2 9 1c4-3 9-1 9-1V4s-5-2-9 1zM12 5v15"/></symbol>
<symbol id="i-team" viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><circle cx="5" cy="12" r="3"/><circle cx="19" cy="12" r="3"/><path d="M7 21v-2a5 5 0 0 1 10 0v2M1 20v-2M23 20v-2"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8zM3 8l9 5 9-5M12 13v9M8 5l9 5"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0z"/><circle cx="12" cy="10" r="2"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="m21 3-7 18-4-8-8-4zM10 13 21 3"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-bot" viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7z"/><circle cx="12" cy="11" r="4"/><path d="M10 16h4"/></symbol>
</defs></svg>
<div class="app">
<aside class="sidebar">
 <a class="brand" href="./"><span class="brand-mark">✦</span> Verifoundry</a>
 <button class="new-task"><svg><use href="#i-plus"/></svg><span>新建任务</span><kbd>Ctrl K</kbd></button>
 <nav class="main-nav" aria-label="主导航">
 <button data-nav="工作台"><svg><use href="#i-grid"/></svg>工作台</button><button data-nav="研究空间"><svg><use href="#i-book"/></svg>研究空间</button><button data-nav="文献库"><svg><use href="#i-file"/></svg>文献库</button><button data-nav="数据集"><svg><use href="#i-box"/></svg>数据集</button><button data-nav="工具箱"><svg><use href="#i-box"/></svg>工具箱</button><button data-nav="智能体团队"><svg><use href="#i-team"/></svg>智能体团队</button>
 </nav>
 <div class="recent-heading">最近的任务 <span>⌁</span></div>
 <div class="recent-list">
 <button class="recent active" data-task="钙钛矿太阳能电池综述"><svg><use href="#i-file"/></svg><span>钙钛矿太阳能电池综述<small>今天 20:24</small></span></button>
 <button class="recent" data-task="分析实验数据并绘图"><svg><use href="#i-edit"/></svg><span>分析实验数据并绘图<small>今天 15:03</small></span></button>
 <button class="recent" data-task="阅读并总结 3 篇论文"><svg><use href="#i-file"/></svg><span>阅读并总结 3 篇论文<small>10月18日</small></span></button>
 <button class="recent" data-task="比较不同方法的性能"><svg><use href="#i-file"/></svg><span>比较不同方法的性能<small>10月16日</small></span></button>
 <button class="recent" data-task="准备组会汇报材料"><svg><use href="#i-file"/></svg><span>准备组会汇报材料<small>10月15日</small></span></button>
 </div>
 <div class="sidebar-bottom"><button class="trash"><svg><use href="#i-trash"/></svg>回收站</button><div class="account"><span class="avatar">R</span><span>Researcher</span><button aria-label="账户设置" class="icon-button" id="settings">⚙</button></div></div>
</aside>
<main class="workspace">
 <header class="workspace-header"><h1 id="project-title">钙钛矿太阳能电池综述</h1><button class="icon-button" id="rename" aria-label="重命名任务"><svg><use href="#i-edit"/></svg></button><div class="header-actions"><span class="demo-label">演示工作台</span><button class="icon-button" id="toggle-panel" aria-label="切换研究面板">⊞</button><button class="icon-button" id="more" aria-label="更多操作">⋯</button></div></header>
 <div class="conversation" id="conversation">
  <div class="user-message"><div class="bubble">帮我调研近三年钙钛矿太阳能电池的最新进展，找出关键论文，并对不同结构的效率、稳定性进行对比分析，最后生成一份可用于组会的汇报报告。</div><span class="avatar">R</span></div>
  <div class="assistant-message"><span class="bot-avatar"><svg><use href="#i-bot"/></svg></span><div class="assistant-body"><p class="intro">好的，我将为你完成这个研究任务。计划分为以下步骤：</p>
   <div class="plan card" id="plan"></div>
   <div class="source-caption">正在检索最新文献<span class="ellipsis">...</span></div>
   <div class="sources"><button data-source="Google Scholar"><svg><use href="#i-pin"/></svg>Google Scholar <span>128</span></button><button data-source="arXiv"><span class="arxiv">↗</span>arXiv <span>36</span></button><button data-source="Web of Science"><svg><use href="#i-pin"/></svg>Web of Science <span>52</span></button><button id="source-more" aria-label="更多检索源">⋯</button></div>
   <section class="papers card"><div class="section-caption">已找到的部分相关论文（示例）</div><div id="paper-list"></div></section>
  </div></div>
 </div>
 <form class="composer" id="composer"><label class="sr-only" for="message">研究问题</label><textarea id="message" placeholder="继续提问，或让 Verifoundry 帮你做其他研究任务..." rows="1"></textarea><div class="composer-tools"><input type="file" id="attachment" hidden accept=".pdf,.txt,.md,.csv"><button type="button" class="icon-button" id="attach" aria-label="添加附件"><svg><use href="#i-plus"/></svg></button><button type="button" class="tool toggle selected" aria-pressed="true"><svg><use href="#i-pin"/></svg>联网搜索</button><button type="button" class="tool" id="research-mode"><svg><use href="#i-team"/></svg><span>研究模式</span><span class="chevron">⌄</span></button><button type="button" class="tool toggle" aria-pressed="false"><svg><use href="#i-box"/></svg>深度分析</button><button type="submit" class="send" aria-label="发送消息"><svg><use href="#i-send"/></svg></button></div><div class="attachment-label" id="attachment-label"></div></form>
</main>
<aside class="inspector" id="inspector">
 <div class="inspector-tabs" role="tablist" aria-label="研究信息"><button role="tab" aria-selected="true" data-tab="progress" class="active">任务进度</button><button role="tab" aria-selected="false" data-tab="references">参考资料</button><button role="tab" aria-selected="false" data-tab="results">数据结果</button><button role="tab" aria-selected="false" data-tab="files">产出文件</button></div>
 <div class="inspector-content" id="inspector-content"></div>
</aside>
</div>
<dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button class="icon-button" id="close-modal" aria-label="关闭">×</button></div><div id="modal-body"></div></dialog><div class="toast" role="status" id="toast"></div>
<script src="app.js"></script>
</body></html>
